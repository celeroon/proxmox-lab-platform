[defaults]
forks             = 100
roles_path        = roles
collections_path  = ./collections
inventory         = inventory/mgmt.ini
host_key_checking = False
retry_files_enabled = False
stdout_callback      = ansible.builtin.default
result_format        = yaml
deprecation_warnings = False

[ssh_connection]
# host_key_checking=False above only adds StrictHostKeyChecking=no, which skips
# unknown hosts but still refuses a *mismatched* one — and IPs in this lab get
# reused across destroy/recreate cycles, so a stale known_hosts entry from a
# previous, different container blocks every connection to the new one.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
