---
# Deploy the OPC-UA generic machine simulator as a systemd service.
#
# Variables:
#   opcua_port:  TCP port to listen on (default: 4840)

- name: Install python3-full and python3-venv
  apt:
    name: [python3, python3-full, python3-venv]
    state: present
    update_cache: yes
  become: true

- name: Create /opt/opcua directory
  file:
    path: /opt/opcua
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Create Python venv
  command: python3 -m venv /opt/opcua/venv
  args:
    creates: /opt/opcua/venv/bin/python3
  become: true

- name: Install asyncua and rich into venv
  pip:
    name:
      - asyncua
      - rich
    virtualenv: /opt/opcua/venv
  become: true

- name: Copy opcua simulation files
  copy:
    src: opcua/
    dest: /opt/opcua/
    owner: root
    group: root
    mode: '0644'
  become: true
  # copies opcua_logic.py, opcua_server.py, opcua_client.py, opcua_tui_common.py,
  # opcua_server_tui.py, opcua_client_tui.py -- run the *_tui.py scripts manually
  # over SSH for a live htop-style status view
  # (/opt/opcua/venv/bin/python3 /opt/opcua/opcua_server_tui.py)

- name: Install opcua-server systemd service
  copy:
    dest: /etc/systemd/system/opcua-server.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=OPC-UA Generic Machine Simulator
      After=network.target

      [Service]
      ExecStart=/opt/opcua/venv/bin/python3 /opt/opcua/opcua_server.py \
        --host 0.0.0.0 \
        --port {{ opcua_port | default(4840) }} \
        --log-file /var/log/opcua-server.log
      Restart=always
      WorkingDirectory=/opt/opcua

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Enable and start opcua-server
  systemd:
    name: opcua-server
    state: started
    enabled: yes
    daemon_reload: yes
  become: true
