---
# Deploy the BACnet HVAC zone simulator (RTU controller) as a systemd service.
#
# Variables:
#   lab_ip:       this VM's own IP — BAC0/bacpypes3 must bind to a concrete
#                 local IP, never 0.0.0.0 (confirmed by direct testing)
#   bacnet_port:  UDP port to listen on (default: 47808)

- name: Install python3-full and python3-venv
  apt:
    name: [python3, python3-full, python3-venv]
    state: present
    update_cache: yes
  become: true

- name: Create /opt/bacnet directory
  file:
    path: /opt/bacnet
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Create Python venv
  command: python3 -m venv /opt/bacnet/venv
  args:
    creates: /opt/bacnet/venv/bin/python3
  become: true

- name: Install BAC0 and rich into venv
  pip:
    name:
      - BAC0==2025.9.15
      - rich
    virtualenv: /opt/bacnet/venv
  become: true

- name: Copy bacnet simulation files
  copy:
    src: bacnet/
    dest: /opt/bacnet/
    owner: root
    group: root
    mode: '0644'
  become: true
  # copies bacnet_logic.py, bacnet_server.py, bacnet_client.py, bacnet_tui_common.py,
  # bacnet_server_tui.py, bacnet_client_tui.py -- run the *_tui.py scripts manually over
  # SSH for a live htop-style status view (/opt/bacnet/venv/bin/python3 /opt/bacnet/bacnet_server_tui.py)

- name: Install bacnet-server systemd service
  copy:
    dest: /etc/systemd/system/bacnet-server.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=BACnet HVAC Zone Simulator (RTU controller)
      After=network.target

      [Service]
      ExecStart=/opt/bacnet/venv/bin/python3 /opt/bacnet/bacnet_server.py \
        --host {{ lab_ip }} \
        --port {{ bacnet_port | default(47808) }} \
        --log-file /var/log/bacnet-server.log
      Restart=always
      RestartSec=5
      WorkingDirectory=/opt/bacnet

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Enable and start bacnet-server
  systemd:
    name: bacnet-server
    state: started
    enabled: yes
    daemon_reload: yes
  become: true
