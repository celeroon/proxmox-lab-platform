---
# Deploy the EtherNet/IP-CIP HMI client simulator as a systemd service.
#
# Variables:
#   server_ip:           IP of the enip-server to connect to (required)
#   enip_port:            TCP port to connect to (default: 44818)
#   poll_seconds:        How often to poll (default: 3.0)
#   external_probe_ip:   Optional — VyOS loopback (e.g. 9.9.9.9) to periodically
#                        probe with a real EtherNet/IP-CIP read, for the
#                        "ICS/IoT External Traffic" dashboard panel. Requires a
#                        matching vyos/configure_external_traffic_redirect
#                        hairpin rule.

- name: Install python3-full and python3-venv
  apt:
    name: [python3, python3-full, python3-venv]
    state: present
    update_cache: yes
  become: true

- name: Create /opt/enip directory
  file:
    path: /opt/enip
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Create Python venv
  command: python3 -m venv /opt/enip/venv
  args:
    creates: /opt/enip/venv/bin/python3
  become: true

- name: Install cpppo and rich into venv
  pip:
    name:
      - cpppo==5.2.5
      - rich
    virtualenv: /opt/enip/venv
  become: true

- name: Copy enip simulation files
  copy:
    src: enip/
    dest: /opt/enip/
    owner: root
    group: root
    mode: '0644'
  become: true
  # copies enip_logic.py, enip_server.py, enip_client.py, enip_tui_common.py,
  # enip_server_tui.py, enip_client_tui.py -- run the *_tui.py scripts manually over
  # SSH for a live htop-style status view (/opt/enip/venv/bin/python3 /opt/enip/enip_client_tui.py)

- name: Install enip-client systemd service
  copy:
    dest: /etc/systemd/system/enip-client.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=EtherNet/IP-CIP Client (HMI simulator)
      After=network.target
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/opt/enip/venv/bin/python3 /opt/enip/enip_client.py \
        --host {{ server_ip }} \
        --port {{ enip_port | default(44818) }} \
        --poll-seconds {{ poll_seconds | default(3.0) }} \
        --log-file /var/log/enip-client.log{{ ' --external-probe-ip ' + external_probe_ip if external_probe_ip is defined else '' }}
      Restart=always
      RestartSec=5
      WorkingDirectory=/opt/enip

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Enable and start enip-client
  systemd:
    name: enip-client
    state: started
    enabled: yes
    daemon_reload: yes
  become: true
