---
- name: Fetch elasticsearch-ca.pem to the controller
  fetch:
    src: /etc/elasticsearch/certs/elasticsearch-ca.pem
    dest: "{{ lab_ansible_dir }}/../data/artifacts/elk/elasticsearch-ca.pem"
    flat: yes
  become: yes

- name: Verify the CA artifact is present and non-empty
  delegate_to: localhost
  become: false
  stat:
    path: "{{ lab_ansible_dir }}/../data/artifacts/elk/elasticsearch-ca.pem"
  register: _ca_artifact

- name: Fail if the CA artifact is empty
  delegate_to: localhost
  become: false
  fail:
    msg: "elasticsearch-ca.pem was not fetched to the controller — Windows enrollment will fail"
  when: not _ca_artifact.stat.exists or _ca_artifact.stat.size == 0
