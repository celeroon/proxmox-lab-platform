---
# Create Windows agent policy with System, Windows, Elastic Defend, Network Traffic,
# and a Custom Windows Event Logs (winlog) integration that collects the
# PowerShellCore/Operational channel (PowerShell 7 script-block logging, 4104).
# Idempotent: skips all steps if windows-policy already exists.
#
# Required vars:
#   elk_password - elastic superuser password

- name: Check if windows-policy already exists
  uri:
    url: "https://{{ kibana_ip }}:5601/api/fleet/agent_policies/windows-policy"
    method: GET
    user: elastic
    password: "{{ elk_password }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 404]
  register: windows_policy_check
  no_log: true

- name: Get installed package versions
  uri:
    url: "https://{{ kibana_ip }}:5601/api/fleet/epm/packages/{{ item }}"
    method: GET
    user: elastic
    password: "{{ elk_password }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: 200
  register: windows_pkg_versions
  loop: [system, windows, endpoint, network_traffic, winlog]
  no_log: true
  when: windows_policy_check.status == 404

- name: Extract package versions
  set_fact:
    win_pkg_system: "{{ windows_pkg_versions.results[0].json.item.version }}"
    win_pkg_windows: "{{ windows_pkg_versions.results[1].json.item.version }}"
    win_pkg_endpoint: "{{ windows_pkg_versions.results[2].json.item.version }}"
    win_pkg_nettraffic: "{{ windows_pkg_versions.results[3].json.item.version }}"
    win_pkg_winlog: "{{ windows_pkg_versions.results[4].json.item.version }}"
  when: windows_policy_check.status == 404

- name: Create Windows agent policy
  uri:
    url: "https://{{ kibana_ip }}:5601/api/fleet/agent_policies"
    method: POST
    user: elastic
    password: "{{ elk_password }}"
    force_basic_auth: yes
    headers:
      kbn-xsrf: kibana
      Content-Type: application/json
    body_format: json
    body:
      id: windows-policy
      name: Windows-Policy
      namespace: default
      monitoring_enabled: [logs, metrics]
    validate_certs: no
    status_code: 200
  no_log: true
  when: windows_policy_check.status == 404

- name: Add System integration
  uri:
    url: "https://{{ kibana_ip }}:5601/api/fleet/package_policies"
    method: POST
    user: elastic
    password: "{{ elk_password }}"
    force_basic_auth: yes
    headers:
      kbn-xsrf: kibana
      Content-Type: application/json
    body_format: json
    body:
      name: system-windows
      namespace: default
      policy_id: windows-policy
      package:
        name: system
        version: "{{ win_pkg_system }}"
    validate_certs: no
    status_code: 200
  no_log: true
  when: windows_policy_check.status == 404

- name: Add Windows integration
  uri:
    url: "https://{{ kibana_ip }}:5601/api/fleet/package_policies"
    method: POST
    user: elastic
    password: "{{ elk_password }}"
    force_basic_auth: yes
    headers:
      kbn-xsrf: kibana
      Content-Type: application/json
    body_format: json
    body:
      name: windows-1
      namespace: default
      policy_id: windows-policy
      package:
        name: windows
        version: "{{ win_pkg_windows }}"
    validate_certs: no
    status_code: 200
  no_log: true
  when: windows_policy_check.status == 404

- name: Add Elastic Defend integration
  uri:
    url: "https://{{ kibana_ip }}:5601/api/fleet/package_policies"
    method: POST
    user: elastic
    password: "{{ elk_password }}"
    force_basic_auth: yes
    timeout: 120
    headers:
      kbn-xsrf: kibana
      Content-Type: application/json
    body_format: json
    body:
      name: endpoint-windows
      namespace: default
      description: ""
      enabled: true
      policy_id: windows-policy
      policy_ids: [windows-policy]
      package:
        name: endpoint
        title: Elastic Defend
        version: "{{ win_pkg_endpoint }}"
        requires_root: true
      inputs:
        - type: endpoint
          enabled: true
          config:
            integration_config:
              value:
                type: endpoint
                endpointConfig:
                  preset: DataCollection
            policy:
              value:
                windows:
                  events:
                    credential_access: true
                    dll_and_driver_load: true
                    dns: true
                    file: true
                    network: true
                    process: true
                    registry: true
                    security: true
                  malware:
                    mode: detect
                    blocklist: true
                  logging:
                    file: info
                mac:
                  events:
                    process: true
                    file: true
                    network: true
                  malware:
                    mode: detect
                    blocklist: true
                  logging:
                    file: info
                linux:
                  events:
                    process: true
                    file: true
                    network: true
                  malware:
                    mode: detect
                    blocklist: true
                  logging:
                    file: info
          streams: []
      vars: {}
    validate_certs: no
    status_code: 200
  no_log: true
  when: windows_policy_check.status == 404

- name: Add Network Traffic integration
  uri:
    url: "https://{{ kibana_ip }}:5601/api/fleet/package_policies"
    method: POST
    user: elastic
    password: "{{ elk_password }}"
    force_basic_auth: yes
    headers:
      kbn-xsrf: kibana
      Content-Type: application/json
    body_format: json
    body:
      name: network_traffic-windows
      namespace: default
      policy_id: windows-policy
      package:
        name: network_traffic
        version: "{{ win_pkg_nettraffic }}"
    validate_certs: no
    status_code: 200
  no_log: true
  when: windows_policy_check.status == 404

# Custom Windows Event Logs integration for the PowerShellCore/Operational channel.
# The stock Windows/System integrations do NOT read this non-default channel, so
# PowerShell 7 (pwsh) script-block events (4104) are otherwise never collected.
# Mirrors the hand-added "winlog-1" policy: the channel var selects the log, and
# the data_stream.dataset override lands events in logs-winlog.winlog-pwsh7-*.
- name: Add Custom Windows Event Logs integration (PowerShellCore/Operational, pwsh7)
  uri:
    url: "https://{{ kibana_ip }}:5601/api/fleet/package_policies"
    method: POST
    user: elastic
    password: "{{ elk_password }}"
    force_basic_auth: yes
    headers:
      kbn-xsrf: kibana
      Content-Type: application/json
    body_format: json
    body:
      name: winlog-1
      namespace: pwsh7
      description: "PowerShell 7 (PowerShellCore/Operational) script-block logging"
      policy_id: windows-policy
      policy_ids: [windows-policy]
      package:
        name: winlog
        title: Custom Windows Event Logs
        version: "{{ win_pkg_winlog }}"
      inputs:
        - type: winlog
          policy_template: winlogs
          enabled: true
          streams:
            - enabled: true
              data_stream:
                type: logs
                dataset: winlog.winlogs
              vars:
                channel:
                  type: text
                  value: "PowerShellCore/Operational"
                data_stream.dataset:
                  type: text
                  value: winlog.winlog
                ignore_older:
                  type: text
                  value: "72h"
                forwarded:
                  type: bool
                  value: false
                preserve_original_event:
                  type: bool
                  value: false
    validate_certs: no
    status_code: 200
  no_log: true
  when: windows_policy_check.status == 404
