---
# Fetch TLS certificates from the Elasticsearch bootstrap node (elastic_nodes[0])
# for a Kibana/Fleet host that is NOT co-located with Elasticsearch.
# Requires elasticsearch_bootstrap to have run on elastic_nodes[0] first; that task
# starts an HTTP cert distribution server on port 19999.
#
# After this task, kibana.yml and fleet_server.yml can run unchanged because they
# read from the same local paths they use on a co-located setup:
#   /etc/elasticsearch/certs/elasticsearch-ca.pem  (fleet_server fingerprint)
#   /tmp/es-http-certs/kibana/kibana.p12            (kibana.yml cert extraction)
#   /tmp/es-http-certs/fleet-server/fleet-server.p12
#
# Required vars:
#   elastic_nodes - cluster node list; elastic_nodes[0] is the bootstrap node
#   elk_cert_pass - .p12 cert password (must match bootstrap; used by later tasks)

# ── Step 1: Create local directories ─────────────────────────────

- name: Create ES certs directory for CA PEM
  file:
    path: /etc/elasticsearch/certs
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Create cert extraction directories for kibana and fleet-server
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /tmp/es-http-certs/kibana
    - /tmp/es-http-certs/fleet-server
  become: yes

# ── Step 2: Wait for cert distribution server ─────────────────────

- name: Wait for cert distribution server on bootstrap node
  wait_for:
    host: "{{ elastic_nodes[0].ip }}"
    port: 19999
    timeout: 120

# ── Step 3: Fetch certs ───────────────────────────────────────────

- name: Fetch CA PEM from bootstrap node
  get_url:
    url: "http://{{ elastic_nodes[0].ip }}:19999/elasticsearch-ca.pem"
    dest: /etc/elasticsearch/certs/elasticsearch-ca.pem
    owner: root
    group: root
    mode: '0644'
    force: yes
  become: yes

- name: Fetch Kibana HTTP cert from bootstrap node
  get_url:
    url: "http://{{ elastic_nodes[0].ip }}:19999/kibana.p12"
    dest: /tmp/es-http-certs/kibana/kibana.p12
    mode: '0644'
    force: yes
  become: yes

- name: Fetch Fleet Server HTTP cert from bootstrap node
  get_url:
    url: "http://{{ elastic_nodes[0].ip }}:19999/fleet-server.p12"
    dest: /tmp/es-http-certs/fleet-server/fleet-server.p12
    mode: '0644'
    force: yes
  become: yes
