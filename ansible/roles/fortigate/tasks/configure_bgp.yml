---
# Configure BGP. Var: bgp_config passed straight to fortios_router_bgp, e.g.
#   {as, router_id, neighbor:[{ip, remote_as, weight, soft_reconfiguration,
#    route_map_in, route_map_out, link_down_failover, holdtime_timer, keep_alive_timer}],
#    network:[{id, prefix}]}
# For fast VPN failover set link_down_failover=enable + low holdtime_timer/keep_alive_timer
# (e.g. 15/5) on the tunnel neighbors; pair with dpd on-idle in configure_ipsec_phase1.

- name: Configure BGP
  fortinet.fortios.fortios_router_bgp:
    vdom: "{{ vdom | default('root') }}"
    router_bgp: "{{ bgp_config }}"
  when: bgp_config is defined
  register: result
  until: result is success
  retries: 5
  delay: 10
