---
# Task: Configure DHCP servers on FortiGate
# Variables:
#   dhcp_servers: List of DHCP server configurations
#     - id: 3
#       interface: "vlan20"
#       status: "enable"
#       lease_time: 28800
#       default_gateway: "172.16.20.254"
#       netmask: "255.255.255.0"
#       dns_service: "specify"
#       dns_server1: "172.16.20.254"
#       ip_range:
#         - id: 0
#           start_ip: "172.16.20.230"
#           end_ip: "172.16.20.250"

- name: Configure DHCP servers
  fortios_system_dhcp_server:
    vdom: "{{ vdom | default('root') }}"
    state: "present"
    system_dhcp_server: "{{ item }}"
  loop: "{{ dhcp_servers | default([]) }}"
  retries: 5
  delay: 10
  until: result is success
  register: result
