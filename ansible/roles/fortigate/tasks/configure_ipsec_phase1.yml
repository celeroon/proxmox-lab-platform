---
# Route-based IPsec phase1-interfaces (IKEv2). Var: ipsec_tunnels (list), each:
#   {name, interface, remote_gw, psk?, net_device?(disable), proposal?(des-sha1),
#    tunnel_ip?, tunnel_remote_ip?}   (ipsec_psk supplies psk when per-tunnel psk omitted)
# tunnel_ip/tunnel_remote_ip assign the APIPA transit IPs a BGP-over-tunnel peer needs.

- name: Configure IPsec phase1-interfaces
  fortinet.fortios.fortios_vpn_ipsec_phase1_interface:
    vdom: "{{ vdom | default('root') }}"
    state: "present"
    vpn_ipsec_phase1_interface:
      name: "{{ item.name }}"
      type: "static"
      interface: "{{ item.interface }}"
      ike_version: 2
      peertype: "any"
      net_device: "{{ item.net_device | default('disable') }}"
      proposal: "{{ item.proposal | default('des-sha1') }}"
      remote_gw: "{{ item.remote_gw }}"
      psksecret: "{{ item.psk | default(ipsec_psk) }}"
  loop: "{{ ipsec_tunnels | default([]) }}"
  register: result
  until: result is success
  retries: 5
  delay: 10

- name: Assign transit IPs to tunnel interfaces
  fortinet.fortios.fortios_system_interface:
    vdom: "{{ vdom | default('root') }}"
    state: "present"
    system_interface:
      name: "{{ item.name }}"
      ip: "{{ item.tunnel_ip }}"
      remote_ip: "{{ item.tunnel_remote_ip }}"
      allowaccess: "{{ item.tunnel_allowaccess | default(['ping']) }}"
  loop: "{{ ipsec_tunnels | default([]) }}"
  when: item.tunnel_ip is defined and item.tunnel_remote_ip is defined
  register: result
  until: result is success
  retries: 5
  delay: 10
