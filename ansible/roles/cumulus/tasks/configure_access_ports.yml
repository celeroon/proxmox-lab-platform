---
# Task: put switch ports into a VLAN-aware bridge as access ports.
#
# Fully data-driven — the old role hardcoded swp1..swp4 with fixed descriptions and a
# `when: inventory_hostname == 'sw-core-1'` guard. Here the port list comes from the
# scenario, so the same task serves any switch with any port count.
# Staged only — nothing is live until cumulus/save_config runs.
#
# Variables:
#   access_ports:    list of {port, vlan, description} (required)
#                      - {port: swp1, vlan: 10, description: "*** ubuntu1 ***"}
#   bridge_domain:   NVUE bridge domain name (default br_default)
#   port_mtu:        L2 MTU for the ports (default 1450, matching the SDN VNet)

- name: Stage bridge domain as VLAN-aware
  command: nv set bridge domain {{ bridge_domain | default('br_default') }} type vlan-aware
  become: true
  changed_when: true

# Every VLAN referenced by access_ports, de-duplicated — no separate vlan list to keep in sync.
- name: Stage VLANs on the bridge domain
  command: >
    nv set bridge domain {{ bridge_domain | default('br_default') }}
    vlan {{ item }}
  become: true
  loop: "{{ access_ports | map(attribute='vlan') | unique | list }}"
  changed_when: true

- name: Stage port description
  command: nv set interface {{ item.port }} description "{{ item.description }}"
  become: true
  loop: "{{ access_ports }}"
  loop_control: {label: "{{ item.port }}"}
  when: item.description is defined
  changed_when: true

# MTU must match the VXLAN-backed VNet or full-size frames are silently dropped
# while small ones (ping) pass.
- name: Stage port MTU
  command: nv set interface {{ item.port }} link mtu {{ port_mtu | default(1450) }}
  become: true
  loop: "{{ access_ports }}"
  loop_control: {label: "{{ item.port }}"}
  changed_when: true

- name: Stage port as bridge access port
  command: >
    nv set interface {{ item.port }}
    bridge domain {{ bridge_domain | default('br_default') }}
    access {{ item.vlan }}
  become: true
  loop: "{{ access_ports }}"
  loop_control: {label: "{{ item.port }} -> vlan {{ item.vlan }}" }
  changed_when: true
