---
# Configure FTD physical interfaces (ifname + IPv4 + optional zone) via FMC. Physical
# interfaces always exist (hardware), so this PUTs the existing object; it is skipped
# when the interface already has the wanted ifname and IP. Resolves device + zone ids.
#
# Required:
#   fmc_host    - FMC mgmt IP ({{ fmc_1_ip }} in a scenario)
#   ftd_device  - managed device name (e.g. ftd-1)
#   phy_interfaces - list of {name, ifname?, ip?, netmask?, zone?}
#                    e.g. {name: Ethernet0/0, ifname: ISP1, ip: 192.0.2.2, netmask: 29}
#                    Omit ifname/ip to only bring the interface up — that is what a
#                    sub-interface TRUNK PARENT needs: it carries no address itself, but
#                    FMC leaves it enabled:false and does NOT enable it when you add a
#                    sub-interface, so the whole VLAN deploys cleanly and passes nothing.
#                    e.g. {name: Ethernet0/1}
# Optional: fmc_user/fmc_pass (default admin / {{ fmc_admin_password }})

- name: Configure FTD physical interfaces
  vars:
    _fmc_user: "{{ fmc_user | default('admin') }}"
    _fmc_pass: "{{ fmc_pass | default(fmc_admin_password) }}"
    _dom: "{{ fmc_auth.domain_uuid | default('') }}"
    # FMC returns these on GET but REFUSES them on PUT: "Invalid value 'either need to be
    # mapped to concrete types...' for field 'metadata'" (HTTP 422). Any read-modify-write
    # against this API has to drop them before sending the object back.
    _ro_fields: ['metadata', 'links']
    _hdr: { X-auth-access-token: "{{ fmc_auth.x_auth_access_token | default('') }}" }
  block:

    - name: Get an FMC auth token
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_platform/v1/auth/generatetoken"
        method: POST
        user: "{{ _fmc_user }}"
        password: "{{ _fmc_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 204]
      delegate_to: localhost
      register: fmc_auth
      until: fmc_auth is succeeded
      retries: 10
      delay: 30

    - name: Resolve device id and security zones
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_config/v1/domain/{{ _dom }}/{{ item }}?expanded=true&limit=1000"
        method: GET
        headers: "{{ _hdr }}"
        validate_certs: no
      delegate_to: localhost
      loop: [ "devices/devicerecords", "object/securityzones", ]
      register: _pilk

    - name: Map ids
      ansible.builtin.set_fact:
        _dev_id: "{{ (_pilk.results[0].json.get('items', []) | selectattr('name','equalto', ftd_device) | first).id }}"
        _zmap: "{{ dict(_pilk.results[1].json.get('items', []) | map(attribute='name') | zip(_pilk.results[1].json.get('items', []) | map(attribute='id'))) }}"

    - name: Get physical interfaces
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_config/v1/domain/{{ _dom }}/devices/devicerecords/{{ _dev_id }}/physicalinterfaces?expanded=true&limit=1000"
        method: GET
        headers: "{{ _hdr }}"
        validate_certs: no
      delegate_to: localhost
      register: _phys

    - name: Configure physical interfaces that differ
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_config/v1/domain/{{ _dom }}/devices/devicerecords/{{ _dev_id }}/physicalinterfaces/{{ _cur.id }}"
        method: PUT
        headers: "{{ _hdr }}"
        body_format: json
        body: >-
          {{ _cur | dict2items | rejectattr('key', 'in', _ro_fields) | items2dict
             | combine({'enabled': true})
             | combine({'ifname': item.ifname,
                        'ipv4': {'static': {'address': item.ip, 'netmask': item.netmask | string}}}
                       if item.ifname is defined else {})
             | combine({'securityZone': {'id': _zmap[item.zone], 'type': 'SecurityZone'}} if item.zone is defined else {}) }}
        status_code: [200, 201]
        validate_certs: no
      vars:
        _cur: "{{ _phys.json.get('items', []) | selectattr('name','equalto', item.name) | first }}"
      delegate_to: localhost
      loop: "{{ phy_interfaces | default([]) }}"
      loop_control: { label: "{{ item.name }}" }
      # Also fires when the interface is merely shut down, so an enable-only entry works.
      when: >-
        not (_cur.enabled | default(false))
        or (item.zone is defined and (_cur.securityZone | default({})).id | default('') != _zmap[item.zone])
        or (item.ifname is defined
            and ((_cur.ifname | default('')) != item.ifname
                 or ((_cur.ipv4 | default({})).static | default({})).address | default('') != item.ip))
