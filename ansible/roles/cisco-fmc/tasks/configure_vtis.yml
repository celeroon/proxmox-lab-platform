---
# Create FTD static VTIs (route-based VPN tunnel interfaces) via FMC. Idempotent:
# skips any whose ifname already exists. Resolves the device id, tunnel-source
# physical interface and security zone by name.
#
# Required:
#   fmc_host    - FMC mgmt IP ({{ fmc_1_ip }} in a scenario)
#   ftd_device  - managed device name (e.g. ftd-1)
#   vtis        - list of {ifname, tunnel_id, ip, netmask, source, zone}
#                 e.g. {ifname: WAN1_BR1_vti_1, tunnel_id: 1, ip: 169.254.2.1,
#                       netmask: 30, source: Ethernet0/0, zone: WAN1_BR1_VTI_1_ZONE}
# Optional: fmc_user/fmc_pass (default admin / {{ fmc_admin_password }})

- name: Configure FTD VTIs
  vars:
    _fmc_user: "{{ fmc_user | default('admin') }}"
    _fmc_pass: "{{ fmc_pass | default(fmc_admin_password) }}"
    _dom: "{{ fmc_auth.domain_uuid | default('') }}"
    _hdr: { X-auth-access-token: "{{ fmc_auth.x_auth_access_token | default('') }}" }
  block:

    - name: Get an FMC auth token
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_platform/v1/auth/generatetoken"
        method: POST
        user: "{{ _fmc_user }}"
        password: "{{ _fmc_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 204]
      delegate_to: localhost
      register: fmc_auth
      until: fmc_auth is succeeded
      retries: 10
      delay: 30

    - name: Resolve device id and security zones
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_config/v1/domain/{{ _dom }}/{{ item }}?limit=1000"
        method: GET
        headers: "{{ _hdr }}"
        validate_certs: no
      delegate_to: localhost
      loop: [ "devices/devicerecords", "object/securityzones", ]
      register: _lookup

    - name: Map device id and zones
      ansible.builtin.set_fact:
        _dev_id: "{{ ((_lookup.results[0].json.get('items', []) | selectattr('name','equalto', ftd_device) | list + [{}]) | first).get('id', '') }}"
        _zmap: "{{ dict(_lookup.results[1].json.get('items', []) | map(attribute='name') | zip(_lookup.results[1].json.get('items', []) | map(attribute='id'))) }}"

    - name: Fail when the managed device is not registered
      ansible.builtin.fail:
        msg: >-
          Device '{{ ftd_device }}' is not registered in FMC (looked up for this role).
          Register it first - without it every id below resolves to nothing and the
          failure surfaces later as an unrelated 'sequence was empty'.
      when: not _dev_id

    - name: List physical interfaces and existing VTIs
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_config/v1/domain/{{ _dom }}/devices/devicerecords/{{ _dev_id }}/{{ item }}?expanded=true&limit=1000"
        method: GET
        headers: "{{ _hdr }}"
        validate_certs: no
      delegate_to: localhost
      loop: [ "physicalinterfaces", "virtualtunnelinterfaces", ]
      register: _devif

    - name: Map physical interface ids
      ansible.builtin.set_fact:
        _pmap: "{{ dict(_devif.results[0].json.get('items', []) | map(attribute='name') | zip(_devif.results[0].json.get('items', []) | map(attribute='id'))) }}"
        _existing_vti: "{{ _devif.results[1].json.get('items', []) | selectattr('ifname', 'defined') | map(attribute='ifname') | list }}"

    - name: Create missing VTIs
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_config/v1/domain/{{ _dom }}/devices/devicerecords/{{ _dev_id }}/virtualtunnelinterfaces"
        method: POST
        headers: "{{ _hdr }}"
        body_format: json
        body:
          type: "VTIInterface"
          ifname: "{{ item.ifname }}"
          tunnelId: "{{ item.tunnel_id }}"
          tunnelType: "STATIC"
          ipsecMode: "ipv4"
          enabled: true
          ipv4:
            static:
              address: "{{ item.ip }}"
              netmask: "{{ item.netmask }}"
          tunnelSource:
            id: "{{ _pmap[item.source] }}"
            name: "{{ item.source }}"
            type: "PhysicalInterface"
          securityZone:
            id: "{{ _zmap[item.zone] }}"
            type: "SecurityZone"
        status_code: [201, 200]
        validate_certs: no
      delegate_to: localhost
      loop: "{{ vtis | default([]) }}"
      when: item.ifname not in _existing_vti
