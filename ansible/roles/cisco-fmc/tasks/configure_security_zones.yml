---
# Create FMC security zones. Idempotent (skips existing by name).
# Required:
#   fmc_host        - FMC mgmt IP ({{ fmc_1_ip }} in a scenario)
#   security_zones  - list of {name, mode}  (mode default ROUTED)
# Optional: fmc_user/fmc_pass (default admin / {{ fmc_admin_password }})

- name: Create FMC security zones
  vars:
    _fmc_user: "{{ fmc_user | default('admin') }}"
    _fmc_pass: "{{ fmc_pass | default(fmc_admin_password) }}"
    _dom: "{{ fmc_auth.domain_uuid | default('') }}"
    _hdr: { X-auth-access-token: "{{ fmc_auth.x_auth_access_token | default('') }}" }
  block:

    - name: Get an FMC auth token
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_platform/v1/auth/generatetoken"
        method: POST
        user: "{{ _fmc_user }}"
        password: "{{ _fmc_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 204]
      delegate_to: localhost
      register: fmc_auth
      until: fmc_auth is succeeded
      retries: 10
      delay: 30

    - name: List existing security zones
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_config/v1/domain/{{ _dom }}/object/securityzones?limit=1000"
        method: GET
        headers: "{{ _hdr }}"
        validate_certs: no
      delegate_to: localhost
      register: fmc_zones

    - name: Create missing security zones
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_config/v1/domain/{{ _dom }}/object/securityzones"
        method: POST
        headers: "{{ _hdr }}"
        body_format: json
        body:
          type: "SecurityZone"
          name: "{{ item.name }}"
          interfaceMode: "{{ item.mode | default('ROUTED') }}"
        status_code: [201, 200]
        validate_certs: no
      delegate_to: localhost
      loop: "{{ security_zones | default([]) }}"
      loop_control: { label: "{{ item.name }}" }
      when: item.name not in (fmc_zones.json.get('items', []) | selectattr('name','defined') | map(attribute='name') | list)
