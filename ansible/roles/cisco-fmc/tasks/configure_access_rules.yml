---
# Create access-control rules in an existing FMC access policy. Idempotent (skips
# rules whose name already exists). Zone/network fields are optional per rule and
# omitted when empty; names are resolved to their FMC object references.
#
# Required:
#   fmc_host       - FMC mgmt IP ({{ fmc_1_ip }} in a scenario)
#   access_policy  - access policy name (e.g. lab-acp)
#   access_rules   - list of {name, action(ALLOW), enabled(true),
#                    src_zones[], dst_zones[], src_nets[], dst_nets[]}  (any list may be empty)
# Optional: fmc_user/fmc_pass (default admin / {{ fmc_admin_password }})

- name: Configure FTD access rules
  vars:
    _fmc_user: "{{ fmc_user | default('admin') }}"
    _fmc_pass: "{{ fmc_pass | default(fmc_admin_password) }}"
    _dom: "{{ fmc_auth.domain_uuid | default('') }}"
    _hdr: { X-auth-access-token: "{{ fmc_auth.x_auth_access_token | default('') }}" }
  block:

    - name: Get an FMC auth token
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_platform/v1/auth/generatetoken"
        method: POST
        user: "{{ _fmc_user }}"
        password: "{{ _fmc_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 204]
      delegate_to: localhost
      register: fmc_auth
      until: fmc_auth is succeeded
      retries: 10
      delay: 30

    - name: Resolve zones, networks, access policies
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_config/v1/domain/{{ _dom }}/{{ item }}?expanded=true&limit=1000"
        method: GET
        headers: "{{ _hdr }}"
        validate_certs: no
      delegate_to: localhost
      loop: [ "object/securityzones", "object/networks", "policy/accesspolicies", ]
      register: _acllk

    - name: Map ids
      ansible.builtin.set_fact:
        _zmap: "{{ dict(_acllk.results[0].json.get('items', []) | map(attribute='name') | zip(_acllk.results[0].json.get('items', []) | map(attribute='id'))) }}"
        _nmap: "{{ dict(_acllk.results[1].json.get('items', []) | map(attribute='name') | zip(_acllk.results[1].json.get('items', []) | map(attribute='id'))) }}"
        _acp_id: "{{ (_acllk.results[2].json.get('items', []) | selectattr('name','equalto', access_policy) | first).id }}"

    - name: List existing access rules
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_config/v1/domain/{{ _dom }}/policy/accesspolicies/{{ _acp_id }}/accessrules?expanded=true&limit=1000"
        method: GET
        headers: "{{ _hdr }}"
        validate_certs: no
      delegate_to: localhost
      register: _acls

    - name: Assemble access-rule create bodies
      ansible.builtin.set_fact:
        _existing_acl: "{{ _acls.json.get('items', []) | selectattr('name','defined') | map(attribute='name') | list }}"
        _acl_bodies: >-
          {%- set ns = namespace(out=[]) -%}
          {%- for r in access_rules -%}
            {%- set body = {'type': 'AccessRule', 'name': r.name,
                            'action': r.action | default('ALLOW'), 'enabled': r.enabled | default(true)} -%}
            {%- set sz = [] -%}{%- for z in r.src_zones | default([]) -%}{%- set _ = sz.append({'type':'SecurityZone','id': _zmap[z],'name': z}) -%}{%- endfor -%}
            {%- if sz -%}{%- set _ = body.update({'sourceZones': {'objects': sz}}) -%}{%- endif -%}
            {%- set dz = [] -%}{%- for z in r.dst_zones | default([]) -%}{%- set _ = dz.append({'type':'SecurityZone','id': _zmap[z],'name': z}) -%}{%- endfor -%}
            {%- if dz -%}{%- set _ = body.update({'destinationZones': {'objects': dz}}) -%}{%- endif -%}
            {%- set sn = [] -%}{%- for n in r.src_nets | default([]) -%}{%- set _ = sn.append({'type':'Network','id': _nmap[n],'name': n}) -%}{%- endfor -%}
            {%- if sn -%}{%- set _ = body.update({'sourceNetworks': {'objects': sn}}) -%}{%- endif -%}
            {%- set dn = [] -%}{%- for n in r.dst_nets | default([]) -%}{%- set _ = dn.append({'type':'Network','id': _nmap[n],'name': n}) -%}{%- endfor -%}
            {%- if dn -%}{%- set _ = body.update({'destinationNetworks': {'objects': dn}}) -%}{%- endif -%}
            {%- set _ = ns.out.append(body) -%}
          {%- endfor -%}
          {{ ns.out | to_json }}

    - name: Create missing access rules
      ansible.builtin.uri:
        url: "https://{{ fmc_host }}/api/fmc_config/v1/domain/{{ _dom }}/policy/accesspolicies/{{ _acp_id }}/accessrules"
        method: POST
        headers: "{{ _hdr }}"
        body_format: json
        body: "{{ item }}"
        status_code: [201, 200]
        validate_certs: no
      delegate_to: localhost
      loop: "{{ _acl_bodies | from_json }}"
      loop_control: { label: "{{ item.name }}" }
      when: item.name not in _existing_acl
