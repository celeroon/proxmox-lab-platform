---
- name: Remove default gateway from Ethernet 2 (async — will drop WinRM briefly)
  ansible.windows.win_shell: |
    $ipInfo = Get-NetIPAddress -InterfaceAlias "Ethernet 2" -AddressFamily IPv4
    $ip = $ipInfo.IPAddress
    $mask = "255.255.0.0"
    netsh interface ip set address "Ethernet 2" static $ip $mask
  async: 45
  poll: 0

- name: Wait for WinRM port to be reachable after network reconfiguration
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | default(5985) }}"
    delay: 5
    timeout: 60
  delegate_to: localhost

- name: Wait for WinRM to be fully operational after network reconfiguration
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 60

- name: Configure static IP on Ethernet 3 (async — will drop WinRM briefly)
  ansible.windows.win_shell: |
    netsh interface ip set address "Ethernet 3" static {{ lab_ip }} {{ lab_mask }} {{ lab_gateway }}
    netsh interface ip set dns     "Ethernet 3" static {{ lab_dns1 }}
    netsh interface ip add dns     "Ethernet 3" {{ lab_dns2 }} index=2
  async: 60
  poll: 0

- name: Wait for WinRM port to be reachable after Ethernet 3 configuration
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | default(5985) }}"
    delay: 5
    timeout: 60
  delegate_to: localhost
