---
# Task: Write advanced audit policy (audit.csv) and SCENoApplyLegacyAuditPolicy
#       into the GPO SYSVOL files in a single pass, then apply with gpupdate.
#
# SCENoApplyLegacyAuditPolicy=1 makes Windows use audit.csv exclusively;
# the legacy [Event Audit] section is intentionally omitted.
#
# Required vars:
#   gpo_audit_name — GPO display name (e.g. "Custom Domain Auditing Policy")
#   ad_domain      — domain FQDN (e.g. "lab.local")

- name: Write GPO audit policy files and apply
  ansible.windows.win_shell: |
    Import-Module GroupPolicy
    $GpoId      = (Get-GPO -Name "{{ gpo_audit_name }}" -Domain "{{ ad_domain }}").Id.ToString().ToUpper()
    $SysvolBase = "\\{{ ad_domain }}\SYSVOL\{{ ad_domain }}\Policies\{$GpoId}\Machine\Microsoft\Windows NT"

    # -----------------------------------------------
    # Advanced audit policy (subcategory-based)
    # Setting values: 0=No Auditing, 1=Success, 2=Failure, 3=Success+Failure
    # -----------------------------------------------
    $AuditDir = "$SysvolBase\Audit"
    New-Item -ItemType Directory -Path $AuditDir -Force | Out-Null

    $AuditCsv = @'
Machine Name,Policy Target,Subcategory,Subcategory GUID,Inclusion Setting,Exclusion Setting,Setting Value
,System,Credential Validation,{0CCE923F-69AE-11D9-BED3-505054503030},Failure,,2
,System,Kerberos Authentication Service,{0CCE9242-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Kerberos Service Ticket Operations,{0CCE9240-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Other Account Logon Events,{0CCE9241-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Application Group Management,{0CCE9239-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Computer Account Management,{0CCE9236-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Distribution Group Management,{0CCE9238-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Other Account Management Events,{0CCE923A-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Security Group Management,{0CCE9237-69AE-11D9-BED3-505054503030},Success,,1
,System,User Account Management,{0CCE9235-69AE-11D9-BED3-505054503030},Success and Failure,,3
,System,DPAPI Activity,{0CCE922D-69AE-11D9-BED3-505054503030},Success and Failure,,3
,System,Plug and Play Events,{0CCE9248-69AE-11D9-BED3-505054503030},Success,,1
,System,Process Creation,{0CCE922B-69AE-11D9-BED3-505054503030},Success,,1
,System,Process Termination,{0CCE922C-69AE-11D9-BED3-505054503030},Success,,1
,System,RPC Events,{0CCE922E-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Token Right Adjusted Events,{0CCE924A-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Detailed Directory Service Replication,{0CCE923E-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Directory Service Access,{0CCE923B-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Directory Service Changes,{0CCE923C-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Directory Service Replication,{0CCE923D-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Account Lockout,{0CCE9217-69AE-11D9-BED3-505054503030},Failure,,2
,System,Group Membership,{0CCE9249-69AE-11D9-BED3-505054503030},Success,,1
,System,IPsec Extended Mode,{0CCE921A-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,IPsec Main Mode,{0CCE9218-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,IPsec Quick Mode,{0CCE9219-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Logoff,{0CCE9216-69AE-11D9-BED3-505054503030},Success,,1
,System,Logon,{0CCE9215-69AE-11D9-BED3-505054503030},Success and Failure,,3
,System,Network Policy Server,{0CCE9243-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Other Logon/Logoff Events,{0CCE921C-69AE-11D9-BED3-505054503030},Success and Failure,,3
,System,Special Logon,{0CCE921B-69AE-11D9-BED3-505054503030},Success,,1
,System,User / Device Claims,{0CCE9247-69AE-11D9-BED3-505054503030},Success,,1
,System,Application Generated,{0CCE9222-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Central Access Policy Staging,{0CCE9246-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Certification Services,{0CCE9221-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Detailed File Share,{0CCE9244-69AE-11D9-BED3-505054503030},Success and Failure,,3
,System,File Share,{0CCE9224-69AE-11D9-BED3-505054503030},Success and Failure,,3
,System,File System,{0CCE921D-69AE-11D9-BED3-505054503030},Success and Failure,,3
,System,Filtering Platform Connection,{0CCE9226-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Filtering Platform Packet Drop,{0CCE9225-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Handle Manipulation,{0CCE9223-69AE-11D9-BED3-505054503030},Success,,1
,System,Kernel Object,{0CCE921F-69AE-11D9-BED3-505054503030},Failure,,2
,System,Other Object Access Events,{0CCE9227-69AE-11D9-BED3-505054503030},Success and Failure,,3
,System,Registry,{0CCE921E-69AE-11D9-BED3-505054503030},Success and Failure,,3
,System,Removable Storage,{0CCE9245-69AE-11D9-BED3-505054503030},Success and Failure,,3
,System,SAM,{0CCE9220-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Audit Policy Change,{0CCE922F-69AE-11D9-BED3-505054503030},Success,,1
,System,Authentication Policy Change,{0CCE9230-69AE-11D9-BED3-505054503030},Success,,1
,System,Authorization Policy Change,{0CCE9231-69AE-11D9-BED3-505054503030},Success,,1
,System,Filtering Platform Policy Change,{0CCE9232-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,MPSSVC Rule-Level Policy Change,{0CCE9233-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Other Policy Change Events,{0CCE9234-69AE-11D9-BED3-505054503030},Success and Failure,,3
,System,Non Sensitive Privilege Use,{0CCE9229-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Other Privilege Use Events,{0CCE922A-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Sensitive Privilege Use,{0CCE9228-69AE-11D9-BED3-505054503030},Success,,1
,System,IPsec Driver,{0CCE9213-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Other System Events,{0CCE9214-69AE-11D9-BED3-505054503030},No Auditing,,0
,System,Security State Change,{0CCE9210-69AE-11D9-BED3-505054503030},Success,,1
,System,Security System Extension,{0CCE9211-69AE-11D9-BED3-505054503030},Success,,1
,System,System Integrity,{0CCE9212-69AE-11D9-BED3-505054503030},Failure,,2
'@

    Set-Content -Path "$AuditDir\audit.csv" -Value $AuditCsv -Encoding UTF8

    # -----------------------------------------------
    # GptTmpl.inf: only the force-override registry key.
    # SCENoApplyLegacyAuditPolicy=1 (DWORD, type 4) ensures
    # audit.csv is used exclusively over any legacy [Event Audit] policy.
    # -----------------------------------------------
    $SecEditDir = "$SysvolBase\SecEdit"
    New-Item -ItemType Directory -Path $SecEditDir -Force | Out-Null

    $GptTmpl = @'
[Unicode]
Unicode=yes

[Registry Values]
MACHINE\System\CurrentControlSet\Control\Lsa\SCENoApplyLegacyAuditPolicy=4,1
'@

    Set-Content -Path "$SecEditDir\GptTmpl.inf" -Value $GptTmpl -Encoding Unicode

    gpupdate /force
