---
# Task: Copy Elasticsearch CA cert to Windows and add to trust store
# Requires: data/artifacts/elk/elasticsearch-ca.pem to exist on the lab host
#           (fetched automatically during elk-1 provisioning)

- name: Transfer elasticsearch-ca.pem
  ansible.windows.win_copy:
    src: "{{ lab_ansible_dir }}/../data/artifacts/elk/elasticsearch-ca.pem"
    dest: C:\win-setup\elasticsearch-ca.pem

- name: Add CA certificate to Windows trust store
  ansible.windows.win_shell: |
    certutil -addstore -f "Root" "C:\win-setup\elasticsearch-ca.pem"
