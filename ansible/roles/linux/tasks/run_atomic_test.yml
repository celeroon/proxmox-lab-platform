---
# Task: Run one or more Windows atomic tests from the Linux attacker, over
# PowerShell-remoting-over-SSH. Each test executes ON the Windows target, so its
# endpoint telemetry (Sysmon, 4688, PowerShell 4104) is generated there and
# shipped to Elastic by the agent.
#
# vars:
#   atomic_target_host — Windows target host/IP (default: injected mgmt IP)
#   atomic_target_user — SSH/remoting user on the target (default: vagrant)
#   atomic_tests       — list of tests to run, each a dict:
#       technique     (required) ATT&CK ID, e.g. "T1059.001"
#       tests         (optional) comma-separated test numbers, e.g. "1,2".
#                     Omit to run every test defined for the technique.
#       target        (optional) target host/IP for THIS test (default: atomic_target_host).
#                     Lets you aim different techniques at different victims — but the
#                     target must trust art-1's key (windows/authorize_ssh_key on it +
#                     linux/deploy_ssh_key ssh-keyscans it into known_hosts).
#       user          (optional) remoting user for THIS test (default: atomic_target_user)
#       get_prereqs   (optional, default false) run -GetPrereqs first
#       cleanup       (optional, default false) run -Cleanup afterwards. Leave
#                     false for tests whose artifact you want to keep, or whose
#                     cleanup is unreliable.
#       timeout       (optional, default 120) per-command timeout in seconds
#
# A fresh SSH session is opened per test (so each shows up as its own logon on
# the target — useful telemetry, and it isolates a hanging test).

- name: Set a run id for this atomic batch (shared ExecutionLog)
  ansible.builtin.set_fact:
    art_runid: "{{ ansible_date_time.iso8601_basic_short }}"
  when: atomic_tests | default([]) | length > 0

- name: Ensure the ExecutionLog directory exists on the attacker
  become: false
  ansible.builtin.file:
    path: "/home/{{ ansible_user | default('vagrant') }}/art-runs"
    state: directory
  when: atomic_tests | default([]) | length > 0

- name: Run atomic tests on the Windows target over SSH
  become: false
  # Built as one semicolon-separated pwsh command so Jinja whitespace handling
  # can't merge statements onto the same line. TestNumbers is folded into the
  # $common hashtable; -GetPrereqs/-Cleanup are conditional, ;-terminated calls.
  ansible.builtin.shell:
    cmd: >-
      pwsh -NoProfile -Command
      '$ErrorActionPreference = "Stop";
      Import-Module invoke-atomicredteam -Force;
      $sess = New-PSSession -HostName {{ item.target | default(atomic_target_host) }} -UserName {{ item.user | default(atomic_target_user | default("vagrant")) }} -KeyFilePath "$HOME/.ssh/id_ed25519" -SSHTransport;
      $common = @{ Session = $sess; PathToAtomicsFolder = "$HOME/AtomicRedTeam/atomics"; TimeoutSeconds = {{ item.timeout | default(120) }}{% if item.tests is defined %}; TestNumbers = @({{ item.tests }}){% endif %} };
      try { {% if item.get_prereqs | default(false) %}Invoke-AtomicTest "{{ item.technique }}" @common -GetPrereqs; {% endif %}Invoke-AtomicTest "{{ item.technique }}" @common -ExecutionLogPath "$HOME/art-runs/run-{{ art_runid }}.csv"; {% if item.cleanup | default(false) %}Invoke-AtomicTest "{{ item.technique }}" @common -Cleanup; {% endif %}}
      finally { Remove-PSSession $sess }'
  loop: "{{ atomic_tests | default([]) }}"
  loop_control:
    label: "{{ item.technique }}{{ ' #' ~ item.tests if item.tests is defined else '' }} -> {{ item.target | default(atomic_target_host) }}"
  register: _atomic_runs
  changed_when: true

- name: Fetch the ART ExecutionLog to the controller artifacts dir
  become: false
  ansible.builtin.fetch:
    src: "/home/{{ ansible_user | default('vagrant') }}/art-runs/run-{{ art_runid }}.csv"
    dest: "{{ lab_ansible_dir }}/../data/artifacts/art/reports/run-{{ art_runid }}.csv"
    flat: yes
  when: atomic_tests | default([]) | length > 0

# Capture each test's console output (stdout+stderr) so the report can show WHAT
# failed for non-zero exits. invoke-atomicredteam prints "Executing test: T####-N"
# per test, which art-report.py splits on to attribute error lines.
- name: Save the atomic output log (for report error detail)
  become: false
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user | default('vagrant') }}/art-runs/run-{{ art_runid }}.log"
    content: |
      {% for r in _atomic_runs.results %}{{ r.stdout | default('') }}
      {{ r.stderr | default('') }}
      {% endfor %}
  when: atomic_tests | default([]) | length > 0

- name: Fetch the atomic output log to the controller artifacts dir
  become: false
  ansible.builtin.fetch:
    src: "/home/{{ ansible_user | default('vagrant') }}/art-runs/run-{{ art_runid }}.log"
    dest: "{{ lab_ansible_dir }}/../data/artifacts/art/reports/run-{{ art_runid }}.log"
    flat: yes
  when: atomic_tests | default([]) | length > 0

- name: Show atomic test output
  # msg as a LIST so the default callback prints one line per element (a header
  # line followed by the test's own output) instead of a stringified array.
  ansible.builtin.debug:
    msg: >-
      {{ ['──────── ' ~ item.item.technique
          ~ (' #' ~ item.item.tests if item.item.tests is defined else '')
          ~ ' ────────'] + (item.stdout_lines | default(['(no output)'])) }}
  loop: "{{ _atomic_runs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.technique }}"
