---
# Controller-side finalizer for the ART scenario. After the atomics have run and
# the ExecutionLog CSV was fetched to data/artifacts/art/reports/, wait for the
# detection rules to fire (they run on their own schedule — Elastic's default is
# ~5 min) and render the ART test report into data/artifacts/art/reports/. That
# dir holds ONLY report/run files (safe to delete); the SSH keys live in art/.
#
# Runs ON THE CONTROLLER (delegate_to: localhost) because that is where the CSV,
# Elasticsearch reachability (mgmt IP), Gotenberg, and the artifacts dir live.
#
# Gated by `art_report` (default false) so it only runs for scenarios that opt in.
# vars:
#   art_report                — true to generate the report (default false)
#   art_report_wait_timeout   — max seconds to poll for detections (default 420)
#   art_report_tz             — display timezone: UTC (default) / local / IANA name
- name: Generate the ART test report on the controller (waits for detections)
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    cmd: >-
      python3 {{ lab_ansible_dir }}/../scripts/art-report.py
      --csv {{ lab_ansible_dir }}/../data/artifacts/art/reports/run-{{ art_runid }}.csv
      --out {{ lab_ansible_dir }}/../data/artifacts/art/reports
      --es https://{{ elk_1_ip }}:9200
      --wait --wait-timeout {{ art_report_wait_timeout | default(420) }}
      {% if art_report_tz is defined %}--tz {{ art_report_tz }}{% endif %}
      {% if art_tactic is defined and art_tactic %}--tactic {{ art_tactic }}{% endif %}
  when: art_report | default(false) and art_runid is defined and (_art_csv.stat.exists | default(false))
  register: _art_report
  changed_when: true

# Also drop the rendered report onto art-1 (the VM that ran the tests), pushed from
# the controller where it was generated. Best-effort (a missing PDF must not fail).
- name: Ensure the report dir exists on art-1
  become: false
  ansible.builtin.file:
    path: "/home/{{ ansible_user | default('vagrant') }}/art-reports"
    state: directory
  when: art_report | default(false) and art_runid is defined

- name: Copy the generated report onto art-1
  become: false
  ansible.builtin.copy:
    src: "{{ lab_ansible_dir }}/../data/artifacts/art/reports/{{ item }}"
    dest: "/home/{{ ansible_user | default('vagrant') }}/art-reports/{{ item }}"
    mode: "0644"
  loop:
    - "report-{{ art_runid }}.pdf"
    - "report-{{ art_runid }}.html"
    - "navigator-{{ art_runid }}.json"
    - "summary-{{ art_runid }}.json"
  loop_control:
    label: "{{ item }}"
  when: art_report | default(false) and art_runid is defined and (_art_csv.stat.exists | default(false))
  failed_when: false

# Mirror the report to a shared, user-readable location (organised per deployment
# user) so colleagues can fetch it without repo access. Needs /opt/lab/reports
# pre-created + writable by the runner; best-effort so it silently skips if absent.
- name: Ensure the per-user report dir exists (/opt mirror)
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "/opt/lab/reports/{{ art_report_user }}"
    state: directory
    mode: "0755"
  when:
    - art_report | default(false)
    - art_report_user | default('') | length > 0
    - _art_csv.stat.exists | default(false)
  failed_when: false

- name: Mirror the report to /opt/lab/reports/<user> (best-effort)
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    src: "{{ lab_ansible_dir }}/../data/artifacts/art/reports/{{ item }}"
    dest: "/opt/lab/reports/{{ art_report_user }}/{{ item }}"
    mode: "0644"
  loop:
    - "report-{{ art_runid }}.pdf"
    - "report-{{ art_runid }}.html"
    - "navigator-{{ art_runid }}.json"
    - "summary-{{ art_runid }}.json"
  loop_control:
    label: "{{ item }}"
  when:
    - art_report | default(false)
    - art_report_user | default('') | length > 0
    - _art_csv.stat.exists | default(false)
  failed_when: false

- name: Show ART report output
  ansible.builtin.debug:
    var: _art_report.stdout_lines
  when: _art_report.stdout_lines is defined
