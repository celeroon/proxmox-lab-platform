---
# All Proxmox API tasks run from localhost using the uri module.
# Credentials are read from environment (exported by setup.sh before calling ansible-playbook).

- name: Set Proxmox API facts
  ansible.builtin.set_fact:
    px_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    px_port: "{{ lookup('env', 'PROXMOX_PORT') | default('8006', true) }}"
    px_auth: "PVEAPIToken={{ lookup('env', 'PROXMOX_TOKEN_ID') }}={{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    px_ssl: "{{ (lookup('env', 'PROXMOX_VERIFY_SSL') | default('false', true)) | bool }}"
    tmpl_dir: "{{ lookup('env', 'TEMPLATES_DIR') | default('/var/lib/lab-platform/templates', true) }}"
    sdn_mtu: "{{ lookup('env', 'SDN_MTU') | default('1500', true) }}"
  tags: proxmox

# ── Get cluster nodes ──────────────────────────────────────────────────────────

- name: Get Proxmox cluster status
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/cluster/status"
    method: GET
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    status_code: 200
  register: px_cluster_resp
  tags: proxmox

- name: Set node IP list
  ansible.builtin.set_fact:
    px_node_ips: >-
      {{ px_cluster_resp.json.data
         | selectattr('type', 'equalto', 'node')
         | selectattr('ip', 'defined')
         | map(attribute='ip')
         | list }}
  tags: proxmox

- name: Fall back to PROXMOX_HOST when node IPs not available
  ansible.builtin.set_fact:
    px_node_ips: ["{{ px_host }}"]
  when: px_node_ips | length == 0
  tags: proxmox

# ── NFS exports ───────────────────────────────────────────────────────────────

- name: Configure NFS exports for Proxmox nodes
  ansible.builtin.template:
    src: nfs-exports.j2
    dest: /etc/exports
    mode: "0644"
  vars:
    node_ips: "{{ px_node_ips }}"
    templates_dir: "{{ tmpl_dir }}"
  notify: reload nfs exports
  tags: proxmox

- name: Flush handlers to apply NFS exports before registering storage pool
  ansible.builtin.meta: flush_handlers
  tags: proxmox

# ── Underlay MTU preflight ────────────────────────────────────────────────────
# VNets are VXLAN-backed, so every guest frame carries 50 bytes of encapsulation:
# a guest MTU of sdn_mtu needs sdn_mtu+50 on the wire between nodes. Getting this
# wrong fails silently — frames fragment (slow, and dropped by some switches), and
# appliances that insist on a full 1500 MTU never bring their data interfaces up at
# all. Cisco FTDv is one: its DPDK ports refuse a 1450 vnet, so lina spins on a
# never-ready port until its watchdog aborts and the appliance reboots, forever.
# Probing from here is a proxy — the controller shares the node L2 segment, so it
# exercises the same physical path the VXLAN tunnels use.

- name: Probe underlay MTU to each Proxmox node
  ansible.builtin.command:
    argv: ["ping", "-M", "do", "-s", "{{ sdn_mtu | int + 22 }}", "-c", "2", "-W", "3", "{{ item }}"]
  loop: "{{ px_node_ips }}"
  register: sdn_mtu_probe
  changed_when: false
  failed_when: false
  tags: proxmox

- name: Require an underlay that can carry sdn_mtu plus VXLAN overhead
  ansible.builtin.assert:
    that: sdn_mtu_probe.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      Underlay cannot carry {{ sdn_mtu | int + 50 }}-byte frames to
      {{ sdn_mtu_probe.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | join(', ') }}.
      VXLAN adds 50 bytes, so sdn_mtu={{ sdn_mtu }} needs at least {{ sdn_mtu | int + 50 }}
      MTU on the node NICs, their bridge, and the physical switch between them.
      Raise those (9000 is the usual choice), or set SDN_MTU=1450 in .env to stay inside
      a 1500-byte underlay — at 1450 Cisco FTDv will not start its data interfaces.
    success_msg: "Underlay carries {{ sdn_mtu | int + 50 }} bytes - sdn_mtu {{ sdn_mtu }} is safe"
  tags: proxmox

# ── SDN zones ─────────────────────────────────────────────────────────────────

- name: Set SDN peers
  ansible.builtin.set_fact:
    sdn_peers: "{{ px_node_ips | join(',') }}"
  tags: proxmox

- name: Check SDN zone labmgmt
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/cluster/sdn/zones/labmgmt"
    method: GET
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    status_code: [200, 404, 500]
  register: zone_labmgmt
  tags: proxmox

- name: Create SDN zone labmgmt
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/cluster/sdn/zones"
    method: POST
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    body_format: form-urlencoded
    body:
      zone: labmgmt
      type: vxlan
      peers: "{{ sdn_peers }}"
      mtu: "{{ sdn_mtu }}"
    status_code: 200
  when: zone_labmgmt.status != 200
  tags: proxmox

- name: Update SDN zone labmgmt peers
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/cluster/sdn/zones/labmgmt"
    method: PUT
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    body_format: form-urlencoded
    body:
      peers: "{{ sdn_peers }}"
      mtu: "{{ sdn_mtu }}"
    status_code: 200
  when: zone_labmgmt.status == 200
  tags: proxmox

- name: Check SDN zone labzone
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/cluster/sdn/zones/labzone"
    method: GET
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    status_code: [200, 404, 500]
  register: zone_labzone
  tags: proxmox

- name: Create SDN zone labzone
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/cluster/sdn/zones"
    method: POST
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    body_format: form-urlencoded
    body:
      zone: labzone
      type: vxlan
      peers: "{{ sdn_peers }}"
      mtu: "{{ sdn_mtu }}"
    status_code: 200
  when: zone_labzone.status != 200
  tags: proxmox

- name: Update SDN zone labzone peers
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/cluster/sdn/zones/labzone"
    method: PUT
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    body_format: form-urlencoded
    body:
      peers: "{{ sdn_peers }}"
      mtu: "{{ sdn_mtu }}"
    status_code: 200
  when: zone_labzone.status == 200
  tags: proxmox

- name: Apply SDN config
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/cluster/sdn"
    method: PUT
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    status_code: [200, 204]
  tags: proxmox

# ── NFS storage pool ──────────────────────────────────────────────────────────

- name: Check NFS template storage pool
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/storage/nfs-templates"
    method: GET
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    status_code: [200, 404, 500]
  register: nfs_storage
  tags: proxmox

- name: Register NFS template storage pool in Proxmox
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/storage"
    method: POST
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    body_format: form-urlencoded
    body:
      storage: nfs-templates
      type: nfs
      server: "{{ ansible_default_ipv4.address }}"
      export: "{{ tmpl_dir }}"
      content: images,vztmpl
    status_code: 200
  when: nfs_storage.status != 200
  tags: proxmox

- name: Update NFS storage to include vztmpl content type
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/storage/nfs-templates"
    method: PUT
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    body_format: form-urlencoded
    body:
      content: images,vztmpl
    status_code: 200
  when: nfs_storage.status == 200 and 'vztmpl' not in (nfs_storage.json.data.content | default(''))
  tags: proxmox

- name: Set primary node name for pveam
  ansible.builtin.set_fact:
    px_primary_node: >-
      {{ px_cluster_resp.json.data
         | selectattr('type', 'equalto', 'node')
         | map(attribute='name')
         | first }}
  tags: proxmox

- name: Update pveam template list
  ansible.builtin.uri:
    url: "https://{{ px_host }}:{{ px_port }}/api2/json/nodes/{{ px_primary_node }}/pveam/update"
    method: POST
    headers:
      Authorization: "{{ px_auth }}"
    validate_certs: "{{ px_ssl }}"
    status_code: 200
  ignore_errors: true
  tags: proxmox
