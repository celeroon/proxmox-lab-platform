---
- name: Install lab-web systemd unit
  ansible.builtin.template:
    src: lab-web.service.j2
    dest: /etc/systemd/system/lab-web.service
    mode: "0644"
  notify: reload systemd
  tags: web

- name: Enable and start lab-web service
  ansible.builtin.service:
    name: lab-web
    state: started
    enabled: true
  tags: web
