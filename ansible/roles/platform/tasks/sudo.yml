---
- name: Allow sudo group to run lab CLI system commands without password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/lab-platform
    mode: "0440"
    validate: visudo -cf %s
    content: |
      %sudo ALL=(ALL) NOPASSWD: \
        /usr/sbin/useradd, \
        /usr/sbin/userdel, \
        /usr/sbin/chpasswd, \
        /usr/sbin/usermod, \
        /usr/bin/tee, \
        /usr/bin/mkdir, \
        /usr/bin/chmod, \
        /usr/bin/chown, \
        /usr/bin/rm, \
        /usr/bin/sed, \
        /usr/bin/networkctl, \
        /usr/bin/systemctl reload dnsmasq, \
        /usr/bin/systemctl restart dnsmasq
  tags: sudo
