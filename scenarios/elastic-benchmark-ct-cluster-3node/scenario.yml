version: 1
name: Elastic Benchmark — 3-Node Proxmox Cluster, Real Capacity
description: >
  Bigger sibling of elastic-benchmark-ct-cluster for a 3-node Proxmox/Ceph cluster
  (~692 GB RAM): multi-master quorum, multiple data/ingest/coord nodes, ILM tiers,
  ~2x the agent count (400 CTs). Scale-out nodes must be created (--skip-ansible)
  before master-1; never deploy without --target.

vm_prefix: ""

x-elastic-config: &elastic-config
  elastic_nodes:
    - {name: master-1, ip: "{{ master_1_ip | default(ansible_host) }}", roles: [master]}
    - {name: master-2, ip: "{{ master_2_ip }}", roles: [master]}
    - {name: master-3, ip: "{{ master_3_ip }}", roles: [master]}
    - {name: data-1, ip: "{{ data_1_ip }}", roles: [data_hot, data_content]}
    - {name: data-2, ip: "{{ data_2_ip }}", roles: [data_hot, data_content]}
    - {name: data-3, ip: "{{ data_3_ip }}", roles: [data_hot, data_content]}
    - {name: data-4, ip: "{{ data_4_ip }}", roles: [data_hot, data_content]}
    - {name: ingest-1, ip: "{{ ingest_1_ip }}", roles: [ingest], fleet_output: true}
    - {name: ingest-2, ip: "{{ ingest_2_ip }}", roles: [ingest], fleet_output: true}
    - {name: coord-1, ip: "{{ coord_1_ip }}", roles: []}
    - {name: coord-2, ip: "{{ coord_2_ip }}", roles: []}
    - {name: data-warm-1, ip: "{{ data_warm_1_ip }}", roles: [data_warm]}
    - {name: data-cold-1, ip: "{{ data_cold_1_ip }}", roles: [data_cold]}
  elk_version: "9.4.2"
  elk_password: "labpassword"
  elk_cert_pass: "labcertpass"
  kibana_ip: "{{ kibana_1_ip | default(ansible_host) }}"
  fleet_ip: "{{ fleet_1_ip | default(ansible_host) }}"
  mirror_ip: "{{ mgmt_1_ip }}"
  es_exporter_password: "labexporterpass"
  ilm_rollover_max_size: "4gb"
  # 1 primary shard caps write throughput to one node; 4 spreads shards across data-1..4.
  ilm_number_of_shards: 4
  # Create the .security index on data-1 — master-1 is master-only and can't hold data.
  es_monitoring_user_host_ip: "{{ data_1_ip }}"

vms:
  - name: mgmt-1
    template: generic-x64/debian12
    clone_mode: full
    cpus: 4
    memory: 8192
    qemu_agent: true
    ansible:
      connection:
        type: ssh
        user: vagrant
        password: vagrant
      gather_facts: true
      become: true
      vars: *elastic-config
      tasks:
        - task: linux/set_hostname
        - task: linux/install_system_packages
        - task: linux/install_xfce
        - task: services/prometheus
        - task: services/grafana
        - task: linux/create_accesses_file
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "127.0.0.1"
            hosts_entry_name: "prometheus.local"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "127.0.0.1"
            hosts_entry_name: "grafana.local"
        - task: linux/add_hosts_entry
          vars:
            # Kibana's port, not raw ES — point at kibana-1.
            hosts_entry_ip: "{{ kibana_1_ip }}"
            hosts_entry_name: "elastic.local"
        # /etc/hosts aliases so mgmt-1 can use node names instead of raw IPs.
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ master_1_ip }}"
            hosts_entry_name: "master-1"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ master_2_ip }}"
            hosts_entry_name: "master-2"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ master_3_ip }}"
            hosts_entry_name: "master-3"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ data_1_ip }}"
            hosts_entry_name: "data-1"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ data_2_ip }}"
            hosts_entry_name: "data-2"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ data_3_ip }}"
            hosts_entry_name: "data-3"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ data_4_ip }}"
            hosts_entry_name: "data-4"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ ingest_1_ip }}"
            hosts_entry_name: "ingest-1"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ ingest_2_ip }}"
            hosts_entry_name: "ingest-2"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ coord_1_ip }}"
            hosts_entry_name: "coord-1"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ coord_2_ip }}"
            hosts_entry_name: "coord-2"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ kibana_1_ip }}"
            hosts_entry_name: "kibana-1"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ fleet_1_ip }}"
            hosts_entry_name: "fleet-1"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ data_warm_1_ip }}"
            hosts_entry_name: "data-warm-1"
        - task: linux/add_hosts_entry
          vars:
            hosts_entry_ip: "{{ data_cold_1_ip }}"
            hosts_entry_name: "data-cold-1"
        - task: services/apt_cacher_ng
        - task: services/elastic_agent_mirror
        - task: services/esrally

  # Core cluster (Step B — provision after the Step A scale-out VMs exist).

  - name: master-1
    depends_on: [mgmt-1]
    template: generic-x64/debian12
    clone_mode: full
    cpu_type: host
    cpus: 2
    memory: 8192
    qemu_agent: true
    ansible:
      connection:
        type: ssh
        user: vagrant
        password: vagrant
      gather_facts: true
      become: true
      vars: *elastic-config
      tasks:
        - task: linux/set_hostname
        - task: linux/install_system_packages
        - task: services/elasticsearch_bootstrap
        - task: services/elasticsearch
          vars:
            lab_ip: "{{ ansible_host }}"
            node_roles: [master, remote_cluster_client]
        - task: services/elasticsearch_ilm
        - task: services/metricbeat
          vars:
            lab_ip: "{{ ansible_host }}"
        - task: services/elasticsearch_exporter
          vars:
            lab_ip: "{{ ansible_host }}"

  - name: master-2
