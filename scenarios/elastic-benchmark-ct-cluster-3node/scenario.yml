  # Agent batches — add incrementally with --target. 8 x 50 = 400 agents.

  - name: agent-batch-1
    type: container
    depends_on: [fleet-1]
    template: debian-13-standard_13.1-2_amd64
    count: 50
    cpus: 1
    memory: 1024
    disk_gb: 5
    ansible:
      forks: 25
      connection:
        type: ssh
        user: root
        password: vagrant
      gather_facts: true
      become: true
      vars: *elastic-config
      tasks:
        - task: linux/set_hostname
        - task: linux/configure_apt_proxy
          vars:
            apt_proxy_ip: "{{ mgmt_1_ip }}"
        - task: linux/install_system_packages
        - task: services/elastic_agent_linux
          vars:
            fleet_ip: "{{ fleet_1_ip }}"
            fleet_policy_id: filestream-test-policy
        - task: services/bench_log_gen
          vars:
            bench_logs_per_second: 500

